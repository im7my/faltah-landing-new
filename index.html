    /* iPhone Frame */
    .iphone-frame {
      width: 300px;
      height: 610px;
      background: #000;
      border-radius: 48px;
      box-shadow: 0 0 0 2px #262626, 0 0 0 5px #141414, 0 0 0 7px #333, 0 25px 60px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
      z-index: 10;
    }

    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(30deg);
      pointer-events: none;
      z-index: 50;
    }

    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 28px;
      background: #000;
      border-radius: 18px;
      z-index: 40;
    }

    .home-indicator {

      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.4);
      border-radius: 10px;
      z-index: 40;
    }

    .app-screen {
      width: 100%;
      height: 100%;
      background: #F8FAFC;
      color: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* FAQ Accordion */
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
      opacity: 0;
    }

    .faq-item.active .faq-answer {
      max-height: 350px;
      opacity: 1;
      margin-top: 0.75rem;
    }

    .faq-icon {
      transition: transform 0.3s ease;
    }

    .faq-item.active .faq-icon {
      transform: rotate(180deg);
    }

    /* Fade Up Animation */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fade-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(16px); }
    }

    .animate-float-1 { animation: floatSlow 6s ease-in-out infinite; }
    .animate-float-2 { animation: floatReverse 7s ease-in-out infinite; }
  </style>

                      </div>

                      <h2 className="text-3xl lg:text-5xl font-black mb-5 leading-tight">
                        {t('roletravt1')}
                        <br />
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500">{t('roletravt2')}</span>
                      </h2>

                      <p className="text-gray-400 text-sm sm:text-base leading-relaxed mb-8">{t('roletravdesc')}</p>

                      <div className="space-y-6 mb-8">
                        <div className="flex items-start gap-4">
                          <div className="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0 text-lg font-bold">💰</div>
                          <div>
                            <h4 className="text-white font-bold text-base mb-1">{t('roletravp1t')}</h4>
                            <p className="text-gray-400 text-xs sm:text-sm leading-relaxed">{t('roletravp1d')}</p>
                          </div>
                        </div>
                      </div>

                      <button onClick={() => setShowModal(true)} className="bg-white text-black px-8 py-3.5 rounded-2xl font-black text-sm hover:bg-gray-200 transition-all shadow-xl cursor-pointer">
                        {t('roletravbtn')}
                      </button>
                    </div>

                    <div className="md:w-1/2 flex justify-center fade-up">
                      <AppMockupTraveler lang={lang} t={t} />
                    </div>
                  </div>

                </div>
              </section>

              {/* Official Inboxes Contact Section */}
              <section id="contact" className="py-24 bg-[#05070C] border-t border-white/5 text-center">
                <div className="container mx-auto max-w-7xl px-6">
                  <h2 className="text-3xl lg:text-4xl font-black text-white mb-3">{t('contacttitle')}</h2>
                  <p className="text-gray-400 text-sm sm:text-base mb-14">{t('contactsub')}</p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    {[
                      { title: t('contactc1t'), desc: t('contactc1d'), email: 'hello@faltahapp.com', icon: '👋', color: 'text-blue-400', border: 'hover:border-blue-500/40' },
                      { title: t('contactc2t'), desc: t('contactc2d'), email: 'support@faltahapp.com', icon: '🛟', color: 'text-emerald-400', border: 'hover:border-emerald-500/40' },
                      { title: t('contactc3t'), desc: t('contactc3d'), email: 'operations@faltahapp.com', icon: '⚙️', color: 'text-amber-400', border: 'hover:border-amber-500/40' },
                      { title: t('contactc4t'), desc: t('contactc4d'), email: 'partners@faltahapp.com', icon: '🤝', color: 'text-purple-400', border: 'hover:border-purple-500/40' }
                    ].map((c, i) => (
                      <div key={i} className={`glass-card p-6 rounded-3xl flex flex-col items-center transition-all duration-300 ${c.border} hover:-translate-y-1`}>
                        <div className="text-2xl mb-3">{c.icon}</div>
                        <h3 className={`text-base font-black mb-1.5 ${c.color}`}>{c.title}</h3>
                        <p className="text-gray-400 text-xs mb-5 leading-relaxed min-h-[32px]">{c.desc}</p>
                        <a href={`mailto:${c.email}`} className="w-full mt-auto bg-[#141924] hover:bg-blue-600 hover:text-white transition-all text-gray-300 font-en py-2.5 rounded-xl text-xs font-bold tracking-wide border border-white/5 truncate px-2">
                          {c.email}
                        </a>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              {/* FAQ Section */}
              <section id="faq" className="py-24 bg-[#030508] border-t border-white/5">
                <div className="container mx-auto max-w-3xl px-6">
                  <h2 className="text-3xl font-black text-white mb-3 text-center">{t('faqtitle')}</h2>
                  <p className="text-gray-400 text-sm mb-12 text-center">{t('faqsub')}</p>

                  <div className="space-y-3.5">
                    {faqData[lang].map((item, idx) => (
                      <div key={idx} className={`faq-item glass-card rounded-2xl overflow-hidden transition-all ${openFaq === idx ? 'active border-blue-500/30' : ''}`}>
                        <button onClick={() => setOpenFaq(openFaq === idx ? null : idx)} className={`w-full flex justify-between items-center p-5 text-slate-200 font-bold text-sm sm:text-base ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                          <span>{item.q}</span>
                          {Icons.ChevronDown}
                        </button>

                        <div className="faq-answer px-5">
                          <p className={`pb-5 text-slate-400 text-xs sm:text-sm border-t border-white/5 pt-3 leading-relaxed ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                            {item.a}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>
          ) : renderLegalPage()}

          {/* Footer */}
          <footer className="pt-16 pb-10 border-t border-white/10 bg-[#020305]">
            <div className="container mx-auto max-w-7xl px-6">
              <div className={`flex flex-col md:flex-row justify-between items-center gap-6 border-b border-white/10 pb-8 mb-8 ${lang === 'en' ? 'md:flex-row-reverse' : ''}`}>
                <div className={`flex flex-col items-center ${lang === 'ar' ? 'md:items-start' : 'md:items-end'} gap-3`}>
                  <BrandLogo onClick={(e) => navigateTo('home', e)} />
                  <div className={`flex items-center gap-3 mt-1 text-gray-400 text-xs ${lang === 'en' ? 'flex-row-reverse' : ''}`}>
                    <span>{lang === 'ar' ? 'تابعنا على:' : 'Follow us:'}</span>
                    <a href="https://www.linkedin.com/company/faltahtech" target="_blank" rel="noopener noreferrer" className="bg-white/5 hover:bg-blue-600 hover:text-white p-2 rounded-full transition-colors text-gray-300">
                      {Icons.LinkedIn}
                    </a>
                  </div>
                </div>

                <div className={`flex flex-wrap justify-center gap-6 text-xs sm:text-sm font-bold text-gray-400 ${lang === 'en' ? 'flex-row-reverse' : ''}`}>
                  <a href="#features" onClick={(e) => handleScrollLink('features', e)} className="hover:text-white transition-colors">{t('navfeatures')}</a>
                  <a href="#roles" onClick={(e) => handleScrollLink('roles', e)} className="hover:text-white transition-colors">{t('navhow')}</a>
                  <a href="#contact" onClick={(e) => handleScrollLink('contact', e)} className="hover:text-white transition-colors">{t('navcontact')}</a>
                  <a href="#faq" onClick={(e) => handleScrollLink('faq', e)} className="hover:text-white transition-colors">{t('navfaq')}</a>
                  <button onClick={(e) => navigateTo('privacy', e)} className="hover:text-white transition-colors cursor-pointer">{t('privacy')}</button>
                  <button onClick={(e) => navigateTo('terms', e)} className="hover:text-white transition-colors cursor-pointer">{t('terms')}</button>
                </div>
              </div>

              <div className="text-center text-[11px] text-gray-500 font-medium">
                <p>{t('copyright')}</p>
              </div>
            </div>
          </footer>

          {/* Early Access Modal */}
          {showModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setShowModal(false)}></div>

              <div className="relative w-full max-w-md bg-[#0D121C] border border-white/10 rounded-3xl shadow-2xl overflow-hidden z-10">
                <div className="flex justify-between items-center px-6 py-4 border-b border-white/10">
                  <h3 className="font-bold text-white text-base">{t('modaltitle')}</h3>
                  <button onClick={() => setShowModal(false)} className="text-gray-400 hover:text-white transition-colors p-1">{Icons.X}</button>
                </div>

                <div className="p-6 md:p-8">
                  <p className={`text-gray-400 text-xs sm:text-sm mb-6 leading-relaxed ${lang === 'ar' ? 'text-right' : 'text-left'}`}>
                    {t('modaldesc')}
                  </p>

                  <WaitlistForm
                    waitlistInput={waitlistInput}
                    setWaitlistInput={setWaitlistInput}
                    submitStatus={submitStatus}
                    onSubmit={handleWaitlistSubmit}
                    t={t}
                  />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
