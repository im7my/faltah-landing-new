      @import url("https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;700;800&display=swap");

      :root {
        --primary: #0a84ff;
        --bg-dark: #000000;
        --bg-surface: #111111;
        --text-main: #ffffff;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Tajawal", sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .font-en {
        font-family: "Inter", sans-serif;
      }

      .iphone-frame {
        width: 300px;
        height: 620px;
        background: #000;
        border-radius: 50px;
        box-shadow:
          0 0 0 2px #222,
          0 0 0 6px #111,
          0 0 0 8px #333,
          0 30px 60px rgba(0, 0, 0, 0.8);
        position: relative;
        overflow: hidden;
        z-index: 10;
      }

      .iphone-frame::before {
        content: "";
        position: absolute;
        top: 0;
        left: -50%;
        width: 200%;
        height: 100%;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.03) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(30deg);
        pointer-events: none;
        z-index: 50;
      }

      .dynamic-island {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 32px;
        background: #000;
        border-radius: 20px;
        z-index: 40;
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
        z-index: 40;
      }

      .app-screen {
        width: 100%;
        height: 100%;
        background: #f2f2f7;
        color: #000;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .faq-answer {
        max-height: 0;
        overflow: hidden;
        transition:
          max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.4s;
        opacity: 0;
      }

      .faq-item.active .faq-answer {
        max-height: 300px;
        opacity: 1;
        margin-top: 1rem;
      }

      .faq-icon {
        transition: transform 0.3s ease;
      }

      .faq-item.active .faq-icon {
        transform: rotate(180deg);
      }

      .fade-up {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .fade-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .glass-header {
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      @keyframes float1 {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      @keyframes float2 {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(20px);
        }
      }
    </style>

                            <div className="w-14 h-14 rounded-[20px] bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shrink-0">
                              🔐
                            </div>
                            <div>
                              <h4 className="text-white font-bold text-xl mb-2">
                                {t("rolesenderp2t")}
                              </h4>
                              <p className="text-gray-500 text-sm">
                                {t("rolesenderp2d")}
                              </p>
                            </div>
                          </div>
                        </div>

                          {t("roletravbadge")}
                        </div>

                        <h2 className="text-4xl lg:text-6xl font-black mb-6 leading-[1.1]">
                          {t("roletravt1")}

                          <span className="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-teal-500">
                            {t("roletravt2")}

                        <p className="text-gray-400 text-lg lg:text-xl leading-relaxed mb-10">
                          {t("roletravdesc")}

                        <div className="space-y-8 mb-10">

                            <div className="w-14 h-14 rounded-[20px] bg-green-500/20 border border-green-500/30 flex items-center justify-center text-green-400 shrink-0">
                              💰
                            </div>
                            <div>
                              <h4 className="text-white font-bold text-xl mb-2">
                                {t("roletravp1t")}
                              </h4>
                              <p className="text-gray-500 text-sm">
                                {t("roletravp1d")}
                              </p>
                            </div>
                          </div>
                        </div>

                        <button
                          onClick={() => setShowModal(true)}
                          className="bg-white text-black px-10 py-4 rounded-[20px] font-black text-lg hover:bg-gray-200 transition-transform hover:-translate-y-1"
                        >
                          {t("roletravbtn")}
                        </button>
                      </div>

                      <div className="md:w-1/2 flex justify-center fade-up">
                        <AppMockupTraveler lang={lang} t={t} />

                    <p className="text-gray-400 text-lg mb-16">
                      {t("contactsub")}
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {[
                        {
                          title: t("contactc1t"),
                          desc: t("contactc1d"),
                          email: "hello@faltah.tech",
                          icon: "✉️",
                          color: "text-green-400",
                        },
                        {
                          title: t("contactc2t"),
                          desc: t("contactc2d"),
                          email: "partners@faltah.tech",
                          icon: "🤝",
                          color: "text-purple-400",
                        },
                        {
                          title: t("contactc3t"),
                          desc: t("contactc3d"),
                          email: "investors@faltah.tech",
                          icon: "📈",
                          color: "text-yellow-400",
                        },
                      ].map((c, i) => (
                        <div
                          key={i}
                          className="bg-[#0f1115] border border-white/5 p-8 rounded-3xl flex flex-col items-center"
                        >
                          <div className="text-3xl mb-4">{c.icon}</div>
                          <h3 className={`text-xl font-black mb-2 ${c.color}`}>
                            {c.title}
                          </h3>
                          <p className="text-gray-500 text-sm mb-8">{c.desc}</p>
                          <a
                            href={`mailto:${c.email}`}
                            className="w-full mt-auto bg-[#1a1c23] hover:bg-[#252830] transition-colors text-gray-300 font-en py-3 rounded-xl text-sm tracking-wide"
                          >
                            {c.email}
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <section
                  id="faq"
                  className="py-24 bg-[#0a0a0a] border-t border-white/5"
                >
                  <div className="container mx-auto max-w-3xl px-6">
                    <h2 className="text-4xl font-black text-white mb-4 text-center">
                      {t("faqtitle")}
                    </h2>
                    <p className="text-gray-400 text-lg mb-16 text-center">
                      {t("faqsub")}
                    </p>

                    <div className="space-y-4">
                      {faqData[lang].map((item, idx) => (
                        <div
                          key={idx}
                          className={`faq-item bg-[#111] border border-white/5 rounded-2xl ${openFaq === idx ? "active border-blue-500/30" : ""}`}
                        >
                          <button
                            onClick={() =>
                              setOpenFaq(openFaq === idx ? null : idx)
                            }
                            className={`w-full flex justify-between items-center p-6 text-slate-200 font-bold ${lang === "ar" ? "text-right" : "text-left"}`}
                          >
                            <span>{item.q}</span>
                            {Icons.ChevronDown}
                          </button>

                          <div className="faq-answer px-6">
                            <p
                              className={`pb-6 text-slate-400 text-sm border-t border-slate-800 pt-4 ${lang === "ar" ? "text-right" : "text-left"}`}
                            >
                              {item.a}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
              </main>

              renderLegalPage()

                  className={`flex flex-col md:flex-row justify-between items-center gap-8 border-b border-white/10 pb-8 mb-8 ${lang === "en" ? "md:flex-row-reverse" : ""}`}
                >
                  <div
                    className={`flex flex-col items-center ${lang === "ar" ? "md:items-start" : "md:items-end"} gap-4`}
                  >
                    <BrandLogo onClick={(e) => navigateTo("home", e)} />

                    <div
                      className={`flex items-center gap-3 mt-2 text-gray-400 text-sm ${lang === "en" ? "flex-row-reverse" : ""}`}
                    >
                      <span>{lang === "ar" ? "تابعنا" : "Follow us"}</span>
                      <a
                        href="https://www.linkedin.com/company/faltahtech"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="hover:text-blue-500 transition-colors"
                      >
                        {Icons.LinkedIn}
                      </a>
                    </div>
                  </div>

                  <div
                    className={`flex flex-wrap justify-center gap-6 text-sm font-bold text-gray-400 ${lang === "en" ? "flex-row-reverse" : ""}`}

                    <a
                      href="#features"
                      onClick={(e) => handleScrollLink("features", e)}
                      className="hover:text-white transition-colors"
                    >
                      {t("navfeatures")}
                    </a>
                    <a
                      href="#faq"
                      onClick={(e) => handleScrollLink("faq", e)}
                      className="hover:text-white transition-colors"
                    >
                      {t("faqtitle")}
                    </a>
                    <button
                      onClick={(e) => navigateTo("privacy", e)}
                      className="hover:text-white transition-colors"
                    >
                      {t("privacy")}
                    </button>
                    <button
                      onClick={(e) => navigateTo("terms", e)}
                      className="hover:text-white transition-colors"
                    >
                      {t("terms")}
                    </button>
                  </div>
                </div>

                <div className="text-center text-sm text-gray-600 font-medium pt-4">
                  <p>{t("copyright")}</p>
                </div>
              </div>
            </footer>

            {showModal && (
              <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                <div
                  className="absolute inset-0 bg-black/80 backdrop-blur-sm"
                  onClick={() => setShowModal(false)}
                ></div>

                <div className="relative w-full max-w-md bg-[#111] border border-white/10 rounded-3xl shadow-2xl overflow-hidden">
                  <div className="flex justify-between items-center px-6 py-4 border-b border-white/10">
                    <h3 className="font-bold text-white">{t("modaltitle")}</h3>
                    <button onClick={() => setShowModal(false)}>
                      {Icons.X}
                    </button>
                  </div>

                  <div className="p-8">
                    <p
                      className={`text-gray-400 text-sm mb-6 leading-relaxed ${lang === "ar" ? "text-right" : "text-left"}`}
                    >
                      {t("modaldesc")}
                    </p>

                    <WaitlistForm
                      waitlistInput={waitlistInput}
                      setWaitlistInput={setWaitlistInput}
                      submitStatus={submitStatus}
                      onSubmit={handleWaitlistSubmit}
                      t={t}
                    />
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
