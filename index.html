                     <span className="text-sm text-gray-500">{t('follow_us')}:</span>
                     {/* LinkedIn Link */}
                     <a href="https://www.linkedin.com/company/faltahtech" target="_blank" rel="noopener noreferrer" className="bg-white/10 p-2 rounded-full text-white hover:bg-[#0A66C2] transition-colors">
                        <LinkedInIcon className="w-5 h-5" />
                     </a>
                  </div>
                </div>

                {/* Footer Links */}
                <div className="flex flex-wrap justify-center gap-8 text-sm font-medium text-gray-400">
                  <a href="#" onClick={(e) => navigateTo('home', e)} className="hover:text-white transition-colors">{t('nav_features')}</a>
                  <a href="#" onClick={(e) => navigateTo('privacy', e)} className="hover:text-white transition-colors">{t('footer_privacy')}</a>
                  <a href="#" onClick={(e) => navigateTo('terms', e)} className="hover:text-white transition-colors">{t('footer_terms')}</a>
                </div>
              </div>
              
              <div className="mt-12 pt-8 border-t border-white/5 text-center text-gray-600 text-xs flex flex-col md:flex-row justify-between items-center gap-2">
                <p>{t('footer_copy')}</p>
                <p className="opacity-50">Designed for Future</p>
              </div>
            </div>
          </footer>

          {/* MODAL */}
          {showModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onClick={() => setShowModal(false)}></div>
              <div className="relative w-full max-w-2xl h-[80vh] bg-[#162032] border border-white/10 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
                <div className="flex justify-between items-center px-6 py-4 border-b border-white/10 bg-[#162032]">
                  <h3 className="font-bold text-white text-lg">{t('modal_title')}</h3>
                  <button onClick={() => setShowModal(false)} className="p-2 hover:bg-white/10 rounded-full text-gray-400 hover:text-white transition-colors">
                    <XIcon />
                  </button>
                </div>
                <div className="flex-1 w-full h-full bg-[#162032]">
                  <iframe 
                    src="https://tally.so/r/mekRol?transparentBackground=1&hideTitle=1" 
                    className="w-full h-full border-0"
                    title="Join Waitlist"
                  ></iframe>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
