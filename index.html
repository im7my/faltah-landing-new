<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>Faltah App</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;700;800&display=swap');

    :root {
      --primary: #0A84FF;
      --bg-dark: #000000;
      --bg-surface: #111111;
      --text-main: #FFFFFF;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-en { font-family: 'Inter', sans-serif; }

    .iphone-frame {
      width: 300px;
      height: 620px;
      background: #000;
      border-radius: 50px;
      box-shadow: 0 0 0 2px #222, 0 0 0 6px #111, 0 0 0 8px #333, 0 30px 60px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      z-index: 10;
    }

    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(30deg);
      pointer-events: none;
      z-index: 50;
    }

    .dynamic-island {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 40;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(255,255,255,0.4);
      border-radius: 10px;
      z-index: 40;
    }

    .app-screen {
      width: 100%;
      height: 100%;
      background: #F2F2F7;
      color: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
      opacity: 0;
    }

    .faq-item.active .faq-answer {
      max-height: 300px;
      opacity: 1;
      margin-top: 1rem;
    }

    .faq-icon {
      transition: transform 0.3s ease;
    }

    .faq-item.active .faq-icon {
      transform: rotate(180deg);
    }

    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fade-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .glass-header {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(20px); }
    }
  </style>
</head>
<body class="selection:bg-blue-500/30">
  <div id="root"></div>

  <!-- تم تغيير الروابط هنا إلى سيرفرات cdnjs لتفادي الحجب -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
